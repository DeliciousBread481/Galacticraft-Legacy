plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

group = "dev.galacticraft"
archivesBaseName = "Galacticraft"
version = "${mod_version}${version_suffix}"

// 保持 Java 8 以兼容旧版 Minecraft
java.toolchain.languageVersion = JavaLanguageVersion.of(8)

repositories {
    mavenCentral()

    flatDir {
        name 'LocalLibs'
        dir file('libs')
    }
    
    // Forge 官方仓库
    maven {
        name 'MinecraftForge'
        url 'https://maven.minecraftforge.net/'
    }
    
    // ModMaven - 托管 Mekanism、IC2、BuildCraft 等
    maven {
        name 'ModMaven'
        url 'https://modmaven.dev/'
    }
    
    // CurseForge Maven - 用于 Biomes O' Plenty、JourneyMap 等
    maven {
        name 'CurseMaven'
        url 'https://cursemaven.com'
        content {
            includeGroup "curse.maven"
        }
    }

    // Source: buildcraftapi
    maven {
        url 'https://mvnrepository.com/artifact/com.mod-buildcraft/buildcraft-api'
    }
    
    // Progwml6 - JEI 旧版本
    maven {
        name 'progwml6'
        url 'https://dvs1.progwml6.com/files/maven/'
    }
    
    // Applied Energistics 2
    maven {
        name 'AE2'
        url 'https://modmaven.dev/'  // AE2 也在 ModMaven
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${MC_VERSION}-${forge_version}"

    // 核心依赖（使用 fg.deobf 进行反混淆）
    implementation fg.deobf('mekanism:Mekanism:1.12.2-9.8.3.390')
    implementation fg.deobf('net.industrial-craft:industrialcraft-2:2.8.222-ex112')
    implementation fg.deobf('com.mod-buildcraft:buildcraft-api:7.99.24.8')
    
    // 可选依赖（仅编译期）
    compileOnly fg.deobf('curse.maven:biomes-o-plenty-220318:2715506')  // 7.0.1.2445
    compileOnly fg.deobf('appeng:appliedenergistics2:rv6-stable-7')
    compileOnly fg.deobf('curse.maven:redstone-flux-270789:2920436')   // 2.1.1.1
    compileOnly 'curse.maven:actually-additions-1.12.2-r152' // r152
    compileOnly 'curse.maven:player-api-1.12.2-1.1'   // 1.1
    compileOnly fg.deobf('curse.maven:journeymap-32274:2916002')       // 5.7.1
    
    // JEI
    compileOnly fg.deobf('mezz.jei:jei_1.12.2:4.16.1.302:api')
    runtimeOnly fg.deobf('mezz.jei:jei_1.12.2:4.16.1.302')
    
    // Lombok（保持原样）
    compileOnly 'org.projectlombok:lombok:1.18.24'
    annotationProcessor 'org.projectlombok:lombok:1.18.24'
    testCompileOnly 'org.projectlombok:lombok:1.18.24'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.24'
}

minecraft {
    mappings channel: 'stable', version: '39-1.12'

    // 添加 Access Transformer 配置
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    
    runs {
        client {
            workingDirectory project.file('run')
            mods {
                galacticraft {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            mods {
                galacticraft {
                    source sourceSets.main
                }
            }
        }
    }
}

// 清理时保留 fg_cache 加速重建
clean {
    def filteredDelete = new HashSet<>()
    for (def toDelete : getDelete()) {
        for (def f : file(toDelete).listFiles()) {
            if (f.getName() != "fg_cache") {
                filteredDelete.add(f)
            }
        }
    }
    setDelete(filteredDelete)
}

tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = false
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
