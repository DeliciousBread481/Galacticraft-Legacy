plugins {
    id 'java'
    id 'eclipse'
    id 'org.cadixdev.licenser' version '0.6.1'
    id 'com.diffplug.spotless' version '6.13.0'
    id 'net.minecraftforge.gradle' version '6.+'
    //id 'net.galacticraft.changelog' version '1.0.4'
    //id 'net.galacticraft.internal.legacy' version '1.0.5'
    //id 'nexus-publishing' version '2.1'
}

group = "dev.galacticraft"
archivesBaseName = "Galacticraft"
version = "${mod_version}${version_suffix}"

java.toolchain.languageVersion = JavaLanguageVersion.of(8)

repositories {
    mavenCentral()
    maven {
        name 'galacticraft'
        url 'https://maven.galacticraft.net/repository/legacy-common/'
    }
    // CurseForge Maven
    maven {  
        name 'cursemaven'  
        url 'https://cursemaven.com'  
    }  
      
    // Mekanism  
    maven {  
        name 'mekanism'  
        url 'https://modmaven.dev/'  
    }  
      
    // IndustrialCraft2  
    maven {  
        name 'ic2'  
        url 'https://maven.ic2.player.to/'  
    }  
      
    // BuildCraft  
    maven {  
        name 'buildcraft'  
        url 'https://mod-buildcraft.com/maven/'  
    }  
      
    // JEI  
    maven {  
        name 'progwml6'  
        url 'https://dvs1.progwml6.com/files/maven/'  
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${MC_VERSION}-${forge_version}"

    implementation 'mod.dependency:mekanism:9.8.3.390'
    implementation 'mod.dependency:industrialcraft-2:2.8.222-ex112'
    implementation 'mod.dependency:buildcraft-api:7.99.24.8'
    compileOnly 'mod.dependency:biomes-o-plenty:7.0.1.2445'
    compileOnly 'mod.dependency:appliedenergistics2:rv6-stable-7'
    compileOnly 'mod.dependency:redstoneflux:2.1.1.1'
    compileOnly 'mod.dependency:actuallyadditions:r152'
    compileOnly 'mod.dependency:playerapi:1.1'
    compileOnly 'mod.dependency:journeymap:5.7.1'
    compileOnly 'mod.dependency:jei:4.16.1.302:api'
    runtimeOnly 'mod.dependency:jei:4.16.1.302'
    
    // Project lombok
    compileOnly 'org.projectlombok:lombok:1.18.24'
    annotationProcessor 'org.projectlombok:lombok:1.18.24'
    testCompileOnly 'org.projectlombok:lombok:1.18.24'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.24'
}

minecraft {  
    mappings channel: 'stable', version: '39-1.12'  
      
    runs {  
        client {  
            workingDirectory project.file('run')  
            //property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'  
            //property 'forge.logging.console.level', 'debug'  
            mods {  
                galacticraft {  
                    source sourceSets.main  
                }  
            }  
        }  
        server {  
            workingDirectory project.file('run')  
            //property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'  
            //property 'forge.logging.console.level', 'debug'  
            mods {  
                galacticraft {  
                    source sourceSets.main  
                }  
            }  
        }  
    }  
}

spotless {
	enforceCheck false
    java {
        target 'src/*/java/micdoodle8/mods/**/*.java'
        endWithNewline()
        trimTrailingWhitespace()
        removeUnusedImports()
        indentWithSpaces()
    }
}

license {
    header = project.file('etc/HEADER')
    properties {
        company = 'Team Galacticraft'
        year = Calendar.getInstance().get(Calendar.YEAR);
    }
    ignoreFailures = true
    include '**/*.java'
}

clean {
    def filteredDelete = new HashSet<>()
    for (def toDelete : getDelete()) {
        for (def f : file(toDelete).listFiles()) {
            if (f.getName() != "fg_cache") {
                filteredDelete.add(f)
            }
        }
    }
    setDelete(filteredDelete)
}

